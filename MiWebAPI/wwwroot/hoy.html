<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronoCare - Agenda de Hoy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'crono-blue': '#27749C',
                        'crono-light': '#E1F4F6',
                        'crono-teal': '#287F89',
                        'crono-dark': '#222222'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-crono-light font-sans overflow-x-hidden flex flex-col">

    <!-- Menú Lateral Desplegable (PC) -->
    <div id="sidebar" class="fixed inset-y-0 right-0 w-64 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="p-5 bg-crono-blue text-white flex justify-between items-center">
            <span class="font-bold text-lg">Menú CronoCare</span>
            <button id="closeSidebar" class="text-white hover:text-gray-200">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="flex flex-col p-6 gap-6">
            <a href="index.html" class="text-gray-700 hover:text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-xl">🏠</span> Inicio
            </a>
            <a href="hoy.html" class="text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-xl">📅</span> Agenda de Hoy
            </a>
            <a href="nuevo_farmaco.html" class="text-gray-700 hover:text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-xl">➕</span> Nuevo Registro
            </a>
            <a href="listo.html" class="text-gray-700 hover:text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-xl">✅</span> Terminados
            </a>
            <hr>
            <button id="btnCerrarSesionLateral" class="text-left text-red-500 hover:text-red-700 font-semibold flex items-center gap-2">
                <span class="text-xl">🚪</span> Salir
            </button>
        </div>
    </div>

    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40 transition-opacity"></div>

    <!-- Encabezado Azul -->
    <div class="bg-crono-blue text-white p-4 md:px-8 md:py-5 shadow-md flex justify-between items-center z-10 w-full">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 flex items-center justify-center overflow-hidden shadow-sm bg-white rounded-full">
                <img src="/Images/logoCronoCare.png" alt="Logo CronoCare" class="w-full h-full object-cover">
            </div>
            <h1 class="text-2xl md:text-3xl font-bold tracking-wide">CronoCare</h1>
        </div>

        <button id="openSidebar" class="hidden md:block text-white hover:text-crono-light transition-colors">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </div>

    <!-- Área de Contenido -->
    <div class="flex-1 pb-24 md:pb-8 w-full max-w-3xl mx-auto flex flex-col">

        <div class="w-full">
            <div class="p-6 md:px-10 md:pt-10 pb-4">
                <h2 class="text-xl md:text-2xl font-bold text-black">¡Hola <span id="nombreUsuario">_____</span>!</h2>
                <p class="text-gray-800 mt-2 md:text-lg font-semibold">Controla tus tomas de hoy</p>
            </div>

            <!-- Lista de tomas pendientes del día -->
            <div class="px-6 md:px-10 flex flex-col gap-5" id="contenedorTomas">

                <!-- Toma 1 (Ejemplo) -->
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-200 relative transition-all duration-500 ease-in-out">
                    <div class="flex items-start gap-4">
                        <div class="w-14 h-14 bg-crono-light rounded-full flex items-center justify-center shrink-0">
                            <svg class="w-8 h-8 text-crono-teal" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M17.34 6.66a5.5 5.5 0 00-7.78 0L6.66 9.56a5.5 5.5 0 000 7.78 5.5 5.5 0 007.78 0l2.9-2.9a5.5 5.5 0 000-7.78zm-4.24 6.36l-2.12-2.12m5.66-2.12L13.1 5.24"></path>
                            </svg>
                        </div>
                        <div class="flex-1 pr-20">
                            <h3 class="font-bold text-crono-dark text-lg md:text-xl leading-tight">Farmaco</h3>
                            <p class="text-sm md:text-base text-gray-500 mt-1">Hora de la toma: <span class="font-semibold text-crono-blue">:00 hrs</span></p>
                        </div>
                    </div>

                    <!-- Botones de Confirmación (Tacha y Palomita) -->
                    <div class="absolute bottom-4 right-4 flex gap-3">
                        <!-- Tacha Roja -->
                        <button class="btn-accion w-8 h-8 rounded-full border-2 border-red-500 text-red-500 flex items-center justify-center hover:bg-red-500 hover:text-white transition-colors" title="No tomada">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                        <!-- Palomita Verde -->
                        <button class="btn-accion w-8 h-8 rounded-full border-2 border-green-500 text-green-500 flex items-center justify-center hover:bg-green-500 hover:text-white transition-colors" title="Tomada">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                        </button>
                    </div>
                </div>

            </div>

            <!-- Mensaje de vacío (Oculto por defecto) -->
            <div id="mensajeVacio" class="hidden text-center mt-12 px-6">
                <span class="text-5xl">🎉</span>
                <h3 class="text-xl font-bold text-gray-700 mt-4">¡Todo listo por hoy!</h3>
                <p class="text-gray-500 mt-2">Has despachado todas tus tomas programadas.</p>
            </div>

        </div>
    </div>

    <!-- BOTÓN FLOTANTE PC (Redirige a perfiles para respetar la regla de selección) -->
    <a href="perfiles.html" class="hidden md:flex fixed bottom-10 right-10 bg-crono-teal text-white w-16 h-16 rounded-full items-center justify-center text-5xl shadow-2xl hover:scale-110 hover:bg-crono-blue transition-all z-40 pb-2">
        +
    </a>

    <!-- BARRA DE NAVEGACIÓN INFERIOR MÓVIL -->
    <div class="md:hidden fixed bottom-0 w-full h-16 bg-white border-t border-gray-200 flex justify-between items-center px-2 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] z-30">
        <!-- INICIO -->
        <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-crono-teal w-1/5 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-[9px] font-bold mt-1">INICIO</span>
        </a>

        <!-- HOY (Activo) -->
        <a href="hoy.html" class="flex flex-col items-center text-crono-teal w-1/5 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            <span class="text-[9px] font-bold mt-1">HOY</span>
        </a>

        <!-- BOTÓN CENTRAL MÓVIL (Lleva a perfiles) -->
        <a href="perfiles.html" class="relative -top-6 bg-crono-teal text-white w-14 h-14 rounded-full flex items-center justify-center text-4xl shadow-lg border-4 border-white transition-transform pb-1 z-50">
            +
        </a>

        <!-- LISTO -->
        <a href="listo.html" class="flex flex-col items-center text-gray-400 hover:text-crono-teal w-1/5 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-[9px] font-bold mt-1">LISTO</span>
        </a>

        <!-- SALIR -->
        <button id="btnCerrarSesion" class="flex flex-col items-center text-gray-400 hover:text-red-500 w-1/5 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            <span class="text-[9px] font-bold mt-1">SALIR</span>
        </button>
    </div>

    <script>
        // --- 1. Lógica Segura del Menú Lateral ---
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const openBtn = document.getElementById('openSidebar');
        const closeBtn = document.getElementById('closeSidebar');

        function toggleMenu() {
            if (sidebar && overlay) {
                sidebar.classList.toggle('translate-x-full');
                overlay.classList.toggle('hidden');
            }
        }

        if (openBtn) openBtn.addEventListener('click', toggleMenu);
        if (closeBtn) closeBtn.addEventListener('click', toggleMenu);
        if (overlay) overlay.addEventListener('click', toggleMenu);

        function cerrarSesion() {
            sessionStorage.removeItem("empleados_usuario");
            localStorage.removeItem("usuarioLogueado");
            window.location.replace("login.html");
        }

        const btnCerrarLateral = document.getElementById('btnCerrarSesionLateral');
        if (btnCerrarLateral) btnCerrarLateral.addEventListener('click', cerrarSesion);

        const btnSalirMovil = document.getElementById('btnCerrarSesion');
        if (btnSalirMovil) btnSalirMovil.addEventListener('click', cerrarSesion);

        // --- 2. Interacción de Tomas (Desaparecer tarjetas) ---
        const botonesAccion = document.querySelectorAll('.btn-accion');
        const contenedorTomas = document.getElementById('contenedorTomas');
        const mensajeVacio = document.getElementById('mensajeVacio');

        botonesAccion.forEach(boton => {
            boton.addEventListener('click', function () {
                const tarjeta = this.closest('div.bg-white');
                if (tarjeta) {
                    tarjeta.style.opacity = '0';
                    tarjeta.style.transform = 'scale(0.95)';

                    setTimeout(() => {
                        tarjeta.remove();
                        if (contenedorTomas && contenedorTomas.children.length === 0 && mensajeVacio) {
                            mensajeVacio.classList.remove('hidden');
                        }
                    }, 500);
                }
            });
        });

        // --- 3. Carga del Nombre de Usuario ---
        document.addEventListener("DOMContentLoaded", () => {
            const usuarioGuardado = localStorage.getItem("usuarioLogueado");
            if (usuarioGuardado) {
                try {
                    const usuario = JSON.parse(usuarioGuardado);
                    const spanNombre = document.getElementById("nombreUsuario");
                    if (spanNombre && usuario.nombre) {
                        spanNombre.textContent = usuario.nombre;
                    }
                } catch (error) {
                    console.error("Error al leer los datos del usuario:", error);
                }
            }
        });
    </script>
</body>
</html>
