<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronoCare - Registrar Fármaco</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'crono-blue': '#27749C',
                        'crono-light': '#E1F4F6',
                        'crono-teal': '#287F89',
                        'crono-dark': '#222222'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-crono-light font-sans overflow-x-hidden flex flex-col">

    <!-- Menú Lateral Desplegable (PC) -->
    <div id="sidebar" class="fixed inset-y-0 right-0 w-64 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="p-5 bg-crono-blue text-white flex justify-between items-center">
            <span class="font-bold text-lg">Menú CronoCare</span>
            <button id="closeSidebar" class="text-white hover:text-gray-200">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="flex flex-col p-6 gap-6">
            <a href="index.html" class="text-gray-700 hover:text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-xl">🏠</span> Inicio
            </a>
            <a href="hoy.html" class="text-gray-700 hover:text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-xl">📅</span> Agenda de Hoy
            </a>
            <a href="nuevo_farmaco.html" class="text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-xl">➕</span> Nuevo Registro
            </a>
            <a href="listo.html" class="text-gray-700 hover:text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-xl">✅</span> Terminados
            </a>
            <hr>
            <button id="btnCerrarSesionLateral" class="text-left text-red-500 hover:text-red-700 font-semibold flex items-center gap-2">
                <span class="text-xl">🚪</span> Salir
            </button>
        </div>
    </div>

    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40 transition-opacity"></div>

    <!-- Encabezado Azul -->
    <div class="bg-crono-blue text-white p-4 md:px-8 md:py-5 shadow-md flex justify-between items-center z-10 w-full">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 flex items-center justify-center overflow-hidden shadow-sm">
                <img src="/Images/logoCronoCare.png" alt="Logo CronoCare" class="w-full h-full object-cover">
            </div>
            <h1 class="text-2xl md:text-3xl font-bold tracking-wide">CronoCare</h1>
        </div>
        <button id="openSidebar" class="hidden md:block text-white hover:text-crono-light transition-colors">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </div>

    <!-- Contenedor del Formulario -->
    <div class="flex-1 pb-24 md:pb-12 w-full max-w-xl mx-auto flex flex-col p-6 mt-4">

        <div class="flex items-center mb-4 w-full">
            <a href="perfiles.html" class="text-gray-700 hover:text-crono-teal transition-colors flex-shrink-0" title="Cambiar de perfil">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
                </svg>
            </a>
            <h2 class="text-lg md:text-xl font-bold text-center text-crono-dark tracking-wide flex-1 mr-8 uppercase">REGISTRAR FÁRMACO</h2>
        </div>

        <!-- Indicador Dinámico del Perfil Seleccionado -->
        <div id="badgePerfilActivo" class="bg-crono-light border border-crono-teal/30 p-3 rounded-2xl mb-5 flex items-center justify-between shadow-sm">
            <div class="flex items-center gap-2">
                <span class="text-xl">👤</span>
                <div>
                    <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wide">Asignado a:</p>
                    <p id="nombrePerfilSeleccionado" class="text-sm font-bold text-crono-blue">Cargando perfil...</p>
                </div>
            </div>
            <a href="perfiles.html" class="text-xs font-bold text-crono-teal hover:underline bg-white px-3 py-1.5 rounded-full shadow-xs">Cambiar</a>
        </div>

        <form id="formFarmaco" class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-gray-200 flex flex-col gap-5">

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1 pl-1">Nombre del medicamento:</label>
                <input type="text" id="nombreMedicamento" class="w-full bg-gray-100 border-2 border-transparent rounded-full px-4 py-2.5 focus:outline-none focus:border-crono-teal shadow-inner" placeholder="Ej. Paracetamol" required>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1 pl-1">Vía de administración:</label>
                <select id="viaAdmin" class="w-full bg-gray-100 border-2 border-transparent rounded-full px-4 py-2.5 focus:outline-none focus:border-crono-teal shadow-inner text-gray-700" required>
                    <option value="" disabled selected>Seleccionar</option>
                    <option value="oral">Oral</option>
                    <option value="intravenosa">Intravenosa</option>
                    <option value="topica">Tópica</option>
                    <option value="inhalatoria">Inhalatoria</option>
                </select>
            </div>

            <div class="flex gap-4">
                <div class="flex-1">
                    <label class="block text-sm font-bold text-gray-700 mb-1 pl-1">Intervalo (horas):</label>
                    <input type="number" id="intervalo" min="1" max="24" class="w-full bg-gray-100 border-2 border-transparent rounded-full px-4 py-2.5 text-center font-semibold focus:outline-none focus:border-crono-teal shadow-inner" placeholder="--" required>
                </div>
                <div class="flex-1">
                    <label class="block text-sm font-bold text-gray-700 mb-1 pl-1">Duración (días):</label>
                    <input type="number" id="duracion" min="1" class="w-full bg-gray-100 border-2 border-transparent rounded-full px-4 py-2.5 text-center font-semibold focus:outline-none focus:border-crono-teal shadow-inner" placeholder="--" required>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1 pl-1 text-center">Hora de la primera toma:</label>
                <div class="flex justify-center">
                    <input type="time" id="horaToma" class="bg-gray-200 border-2 border-transparent rounded-full px-6 py-2 text-center font-bold text-lg focus:outline-none focus:border-crono-teal shadow-inner" required>
                </div>
            </div>

            <div class="flex flex-col gap-3 mt-4">
                <a href="tomar_fotografia.html" class="w-full bg-crono-teal text-white font-bold py-3 rounded-full hover:bg-crono-blue transition-colors shadow-md text-sm tracking-wide block text-center">
                    TOMAR FOTOGRAFÍA
                </a>
                <button type="submit" id="btnGuardar" class="w-full bg-crono-blue text-white font-bold py-3 rounded-full hover:bg-blue-700 transition-colors shadow-md text-sm tracking-wide">
                    GUARDAR
                </button>
            </div>

            <div id="mensajeAlerta" class="hidden text-center font-semibold mt-2 text-sm"></div>
        </form>
    </div>

    <!-- BARRA DE NAVEGACIÓN INFERIOR (Móvil) -->
    <div class="md:hidden fixed bottom-0 w-full h-16 bg-white border-t border-gray-200 flex justify-between items-center px-2 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] z-30">
        <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-crono-teal w-1/5 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-[9px] font-bold mt-1">INICIO</span>
        </a>
        <a href="hoy.html" class="flex flex-col items-center text-gray-400 hover:text-crono-teal w-1/5 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            <span class="text-[9px] font-bold mt-1">HOY</span>
        </a>
        <a href="nuevo_farmaco.html" class="relative -top-6 bg-crono-teal text-white w-14 h-14 rounded-full flex items-center justify-center text-4xl shadow-lg border-4 border-white transition-transform pb-1 z-50">
            +
        </a>
        <!--<a href="perfiles.html" class="flex flex-col items-center text-crono-teal w-1/5 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span class="text-[9px] font-bold mt-1">PERFILES</span>
    </a>-->
        <button class="flex flex-col items-center text-gray-400 hover:text-crono-teal w-1/5 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-[9px] font-bold mt-1">LISTO</span>
        </button>
        <button id="btnCerrarSesion" class="flex flex-col items-center text-gray-400 hover:text-red-500 w-1/5 transition-colors" onclick="sessionStorage.removeItem('empleados_usuario'); window.location.replace('login.html');">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            <span class="text-[9px] font-bold mt-1">SALIR</span>
        </button>
    </div>

    <!-- Script de Menú y Carga de Perfil Activo -->
    <script>
        // Lógica del Menú Lateral
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const openBtn = document.getElementById('openSidebar');
        const closeBtn = document.getElementById('closeSidebar');

        function toggleMenu() {
            sidebar.classList.toggle('translate-x-full');
            overlay.classList.toggle('hidden');
        }

        if (openBtn) openBtn.addEventListener('click', toggleMenu);
        if (closeBtn) closeBtn.addEventListener('click', toggleMenu);
        if (overlay) overlay.addEventListener('click', toggleMenu);

        document.getElementById('btnCerrarSesionLateral')?.addEventListener('click', () => {
            sessionStorage.removeItem("empleados_usuario");
            window.location.replace("login.html");
        });

        // Verificar y mostrar el perfil seleccionado al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            const perfilGuardado = sessionStorage.getItem('perfilSeleccionado');
            const etiquetaNombre = document.getElementById('nombrePerfilSeleccionado');

            if (!perfilGuardado) {
                alert("Debes seleccionar un perfil de cuidado antes de registrar un fármaco.");
                window.location.replace("perfiles.html");
                return;
            }

            const perfil = JSON.parse(perfilGuardado);
            if (etiquetaNombre) {
                etiquetaNombre.textContent = `${perfil.nombre} (${perfil.parentesco})`;
            }
        });

        // Lógica del Formulario API
        document.getElementById('formFarmaco').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnGuardar = document.getElementById('btnGuardar');
            const mensajeAlerta = document.getElementById('mensajeAlerta');

            btnGuardar.disabled = true;
            btnGuardar.textContent = "GUARDANDO...";

            const nombre = document.getElementById('nombreMedicamento').value.trim();
            const viaAdmin = document.getElementById('viaAdmin').value;
            const intervalo = parseFloat(document.getElementById('intervalo').value);

            const empleadoFalso = {
                idEmpleado: 0,
                nombreCompleto: nombre,
                correo: `${viaAdmin}@cronocare.com`,
                sueldo: intervalo,
                fechaContrato: new Date().toISOString().split('T')[0]
            };

            try {
                const respuesta = await fetch('/api/Empleado', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(empleadoFalso)
                });

                const resultado = await respuesta.json();

                if (respuesta.ok && resultado.isSuccess) {
                    mensajeAlerta.textContent = "¡Fármaco guardado correctamente!";
                    mensajeAlerta.className = "text-center font-bold mt-3 text-sm text-green-600 block";

                    setTimeout(() => window.location.replace("index.html"), 1000);
                } else {
                    throw new Error(resultado.respuesta || "Error al guardar el fármaco");
                }
            } catch (error) {
                mensajeAlerta.textContent = error.message;
                mensajeAlerta.className = "text-center font-bold mt-3 text-sm text-red-500 block";
            } finally {
                btnGuardar.disabled = false;
                btnGuardar.textContent = "GUARDAR";
            }
        });
    </script>
</body>
</html>
