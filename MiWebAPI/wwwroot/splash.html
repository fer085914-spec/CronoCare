<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronoCare - Inicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
                tailwind.config = {
                    theme: {
                        extend: {
                            colors: {
                                'crono-blue': '#27749C',
                                'crono-light': '#E1F4F6',
                                'crono-teal': '#287F89'
                            }
                        }
                    }
                }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-screen w-screen bg-crono-light flex flex-col items-center justify-center overflow-hidden font-sans">

    <!-- Nombre de la App -->
    <h1 class="text-4xl md:text-5xl font-extrabold text-crono-blue mb-8 tracking-wide">CronoCare</h1>

    <!-- Logotipo animado (Latido) -->
    <div class="w-48 h-48 md:w-64 md:h-64 bg-white rounded-full flex items-center justify-center shadow-lg mb-10 animate-pulse border-4 border-white">
        <img src="/Images/logoCronoCare.png" class="w-full h-full object-cover">
    </div>

    <!-- Eslogan -->
    <p class="text-crono-blue font-medium text-lg md:text-xl tracking-widest text-center">Nunca olvides una dosis</p>

    <!-- Script de redirección automática -->
    <script>
                // Redirige al Login después de 2.5 segundos (2500 milisegundos)
                setTimeout(() => {
                    window.location.replace("login.html");
                }, 2500);
    </script>
</body>
</html>
