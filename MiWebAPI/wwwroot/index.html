<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronoCare - Menú Principal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'crono-blue': '#27749C',
                        'crono-light': '#E1F4F6',
                        'crono-teal': '#287F89',
                        'crono-dark': '#222222'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-crono-light font-sans overflow-x-hidden">

    <!-- Menú Lateral Desplegable (PC) -->
    <div id="sidebar" class="fixed inset-y-0 right-0 w-64 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="p-5 bg-crono-blue text-white flex justify-between items-center">
            <span class="font-bold text-lg">Menú CronoCare</span>
            <button id="closeSidebar" class="text-white hover:text-gray-200">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="flex flex-col p-6 gap-6">
            <a href="index.html" class="text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-xl">🏠</span> Inicio
            </a>
            <a href="hoy.html" class="text-gray-700 hover:text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-xl">📅</span> Agenda de Hoy
            </a>
            <a href="nuevo_farmaco.html" class="text-gray-700 hover:text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-xl">➕</span> Nuevo Registro
            </a>
            <a href="listo.html" class="text-gray-700 hover:text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-xl">✅</span> Terminados
            </a>
            <hr>
            <button id="btnCerrarSesionLateral" class="text-left text-red-500 hover:text-red-700 font-semibold flex items-center gap-2">
                <span class="text-xl">🚪</span> Salir
            </button>
        </div>
    </div>

    <!-- Fondo oscuro semitransparente -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40 transition-opacity"></div>

    <!-- Contenedor principal -->
    <div class="w-full min-h-screen relative flex flex-col">

        <!-- Encabezado Azul -->
        <div class="bg-crono-blue text-white p-4 md:px-8 md:py-5 shadow-md flex justify-between items-center z-10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 flex items-center justify-center overflow-hidden shadow-sm">
                    <img src="/Images/logoCronoCare.png" alt="Logo CronoCare" class="w-full h-full object-cover">
                </div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-wide">CronoCare</h1>
            </div>
            <button id="openSidebar" class="hidden md:block text-white hover:text-crono-light transition-colors">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>

        <!-- Área de Contenido -->
        <div class="flex-1 pb-24 md:pb-8 w-full max-w-3xl mx-auto flex flex-col px-4 md:px-0">

            <div class="w-full">
                <div class="p-6 md:px-10 md:pt-10 pb-4">
                    <h2 class="text-xl md:text-2xl font-bold text-black">¡Hola <span id="nombreUsuario">_____</span>!</h2>
                    <p class="text-gray-800 mt-2 md:text-lg font-semibold">Esquemas médicos activos:</p>
                </div>

                <!-- CONTENEDOR DINÁMICO DE SECCIONES DESPLEGABLES POR PERFIL -->
                <div id="contenedorPerfilesIndex" class="px-6 md:px-10 flex flex-col gap-4">
                    <div class="bg-white p-6 rounded-2xl shadow-sm text-center">
                        <p class="text-gray-500">Cargando perfiles y esquemas...</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- BOTÓN FLOTANTE PC -->
        <a href="perfiles.html" title="Nuevo Registro" class="hidden md:flex fixed bottom-10 right-10 bg-crono-teal text-white w-16 h-16 rounded-full items-center justify-center text-5xl shadow-2xl hover:scale-110 hover:bg-crono-blue transition-all z-40 pb-2">
            +
        </a>

        <!-- BARRA DE NAVEGACIÓN INFERIOR MÓVIL -->
        <div class="md:hidden fixed bottom-0 w-full h-16 bg-white border-t border-gray-200 flex justify-between items-center px-2 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] z-30">
            <a href="index.html" class="flex flex-col items-center text-crono-teal w-1/5 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-[9px] font-bold mt-1">INICIO</span>
            </a>
            <a href="hoy.html" class="flex flex-col items-center text-gray-400 hover:text-crono-teal w-1/5 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                <span class="text-[9px] font-bold mt-1">HOY</span>
            </a>
            <a href="perfiles.html" class="relative -top-6 bg-crono-teal text-white w-14 h-14 rounded-full flex items-center justify-center text-4xl shadow-lg border-4 border-white transition-transform pb-1 z-50">
                +
            </a>
            <a href="listo.html" class="flex flex-col items-center text-gray-400 hover:text-crono-teal w-1/5 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="text-[9px] font-bold mt-1">LISTO</span>
            </a>
            <button id="btnCerrarSesion" class="flex flex-col items-center text-gray-400 hover:text-red-500 w-1/5 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span class="text-[9px] font-bold mt-1">SALIR</span>
            </button>
        </div>
    </div>

    <!-- Script de Funcionalidad y Carga Dinámica -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const openBtn = document.getElementById('openSidebar');
        const closeBtn = document.getElementById('closeSidebar');

        function toggleMenu() {
            if (sidebar && overlay) {
                sidebar.classList.toggle('translate-x-full');
                overlay.classList.toggle('hidden');
            }
        }
        if (openBtn) openBtn.addEventListener('click', toggleMenu);
        if (closeBtn) closeBtn.addEventListener('click', toggleMenu);
        if (overlay) overlay.addEventListener('click', toggleMenu);

        // --- SESIÓN Y UTILIDADES ---
        const CLAVE_SESION = 'usuarioLogueado';
        const API = '/api/Auth';

        function obtenerUsuarioSesion() {
            const guardado = localStorage.getItem(CLAVE_SESION);
            if (!guardado) return null;
            try {
                const u = JSON.parse(guardado);
                const id = u.id ?? u.idUsuario;
                return id ? { id: Number(id), nombre: u.nombre, tipoUso: u.tipoUso } : null;
            } catch (e) {
                return null;
            }
        }

        function cerrarSesion() {
            localStorage.removeItem(CLAVE_SESION);
            sessionStorage.removeItem('perfilSeleccionado');
            window.location.replace('login.html');
        }

        document.getElementById('btnCerrarSesionLateral')?.addEventListener('click', cerrarSesion);
        document.getElementById('btnCerrarSesion')?.addEventListener('click', cerrarSesion);

        async function llamarApi(url, opciones) {
            const respuesta = await fetch(url, opciones);
            let datos = null;
            try { datos = await respuesta.json(); } catch (e) { }
            if (!respuesta.ok) {
                throw new Error((datos && datos.message) || 'No se pudo completar la solicitud.');
            }
            return datos;
        }

        // --- CARGA DEL DASHBOARD ---
        document.addEventListener("DOMContentLoaded", async () => {
            const usuario = obtenerUsuarioSesion();
            if (!usuario) {
                window.location.replace("login.html");
                return;
            }

            const spanNombre = document.getElementById("nombreUsuario");
            if (spanNombre && usuario.nombre) {
                spanNombre.textContent = usuario.nombre;
            }

            await cargarSeccionesPerfiles(usuario.id);
        });

        async function cargarSeccionesPerfiles(idUsuario) {
            const contenedor = document.getElementById("contenedorPerfilesIndex");

            try {
                const perfiles = await llamarApi(`${API}/perfiles/${idUsuario}`);

                if (!perfiles || perfiles.length === 0) {
                    contenedor.innerHTML = `
                            <div class="bg-white p-6 rounded-2xl shadow-sm text-center">
                                <p class="text-gray-500 mb-2">No tienes perfiles creados todavía.</p>
                                <a href="perfiles.html" class="text-crono-teal font-bold hover:underline text-sm">Crear un perfil aquí</a>
                            </div>`;
                    return;
                }

                contenedor.innerHTML = "";

                for (const perfil of perfiles) {
                    const idPerfil = perfil.idPerfil;
                    const nombrePerfil = perfil.nombre;

                    const cardHTML = `
                            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                                <button onclick="toggleAcordeon('perfil-${idPerfil}')" class="w-full p-5 bg-white flex justify-between items-center hover:bg-crono-light/30 transition-colors">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 bg-crono-light text-crono-teal rounded-full flex items-center justify-center font-bold text-lg">
                                            👤
                                        </div>
                                        <div class="text-left">
                                            <h3 class="font-bold text-crono-dark text-base md:text-lg">${nombrePerfil}</h3>
                                            <p class="text-xs text-gray-500" id="contador-${idPerfil}">Cargando medicamentos...</p>
                                        </div>
                                    </div>
                                    <svg id="icon-perfil-${idPerfil}" class="w-6 h-6 text-crono-teal transform transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                    </svg>
                                </button>

                                <div id="perfil-${idPerfil}" class="hidden flex flex-col gap-3 p-4 bg-gray-50 border-t border-gray-100">
                                    <!-- Aquí se inyectarán los medicamentos activos -->
                                </div>
                            </div>
                        `;
                    contenedor.innerHTML += cardHTML;

                    await cargarMedicamentosPorPerfil(idUsuario, idPerfil);
                }

            } catch (error) {
                console.error("Error al cargar perfiles para el dashboard:", error);
                contenedor.innerHTML = `<div class="bg-white p-6 rounded-2xl shadow-sm text-center"><p class="text-red-500">Error al cargar la información.</p></div>`;
            }
        }

        async function cargarMedicamentosPorPerfil(idUsuario, idPerfil) {
            const contenedorLista = document.getElementById(`perfil-${idPerfil}`);
            const contadorLabel = document.getElementById(`contador-${idPerfil}`);

            try {
                const medicamentos = await llamarApi(`${API}/medicamentos/activos/${idUsuario}/${idPerfil}`);

                contadorLabel.textContent = `${medicamentos.length} medicamentos activos`;
                contenedorLista.innerHTML = "";

                if (!medicamentos || medicamentos.length === 0) {
                    contenedorLista.innerHTML = `<p class="text-gray-400 text-sm italic text-center py-2">No hay esquemas médicos activos para este perfil.</p>`;
                    return;
                }

                medicamentos.forEach(med => {
                    const proximaTomaTexto = med.proximaToma ? new Date(med.proximaToma).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Pendiente';

                    // Cada fármaco ahora enlaza correctamente a su pantalla de detalle pasando el ID único (?id=...)
                    const farmacoHTML = `
                            <a href="detalle_farmaco.html?id=${med.idMedicamento}" class="block bg-white rounded-xl p-4 shadow-xs border border-gray-200 relative hover:shadow-md transition-shadow group">
                                <div class="flex items-start gap-3">
                                    <div class="w-12 h-12 bg-crono-light rounded-full flex items-center justify-center shrink-0 group-hover:bg-crono-teal transition-colors">
                                        <svg class="w-6 h-6 text-crono-blue group-hover:text-white transition-colors" fill="currentColor" viewBox="0 0 24 24">
                                            <path d="M17.34 6.66a5.5 5.5 0 00-7.78 0L6.66 9.56a5.5 5.5 0 000 7.78 5.5 5.5 0 007.78 0l2.9-2.9a5.5 5.5 0 000-7.78zm-4.24 6.36l-2.12-2.12m5.66-2.12L13.1 5.24"></path>
                                        </svg>
                                    </div>
                                    <div class="flex-1 pr-12">
                                        <h4 class="font-bold text-crono-dark text-base leading-tight group-hover:text-crono-teal transition-colors">${med.nombreMedicamento}</h4>
                                        <p class="text-xs text-gray-500 mt-0.5">Vía: <span class="font-medium">${med.viaAdministracion || 'General'}</span></p>
                                        <p class="text-xs md:text-sm text-gray-500 mt-0.5">Próxima toma: <span class="font-semibold text-crono-blue">${proximaTomaTexto}</span></p>
                                    </div>
                                </div>
                            </a>
                        `;
                    contenedorLista.innerHTML += farmacoHTML;
                });

            } catch (error) {
                console.error(`Error cargando medicamentos del perfil ${idPerfil}:`, error);
                contadorLabel.textContent = `Error al cargar`;
                contenedorLista.innerHTML = `<p class="text-red-400 text-sm italic text-center py-2">No se pudieron cargar los medicamentos.</p>`;
            }
        }

        function toggleAcordeon(idSeccion) {
            const contenido = document.getElementById(idSeccion);
            const icono = document.getElementById('icon-' + idSeccion);

            if (contenido.classList.contains('hidden')) {
                contenido.classList.remove('hidden');
                icono.classList.add('rotate-180');
            } else {
                contenido.classList.add('hidden');
                icono.classList.remove('rotate-180');
            }
        }
    </script>
</body>
</html>
