<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronoCare - Editar Fármaco</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'crono-blue': '#27749C',
                        'crono-light': '#E1F4F6',
                        'crono-teal': '#287F89',
                        'crono-dark': '#222222'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-crono-light font-sans overflow-x-hidden flex flex-col">

    <!-- Menú Lateral Desplegable (PC) -->
    <div id="sidebar" class="fixed inset-y-0 right-0 w-64 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="p-5 bg-crono-blue text-white flex justify-between items-center">
            <span class="font-bold text-lg">Menú CronoCare</span>
            <button id="closeSidebar" class="text-white hover:text-gray-200">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="flex flex-col p-6 gap-6">
            <a href="index.html" class="text-gray-700 hover:text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-xl">🏠</span> Inicio
            </a>
            <a href="hoy.html" class="text-gray-700 hover:text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-xl">📅</span> Agenda de Hoy
            </a>
            <a href="nuevo_farmaco.html" class="text-gray-700 hover:text-crono-teal font-semibold flex items-center gap-2">
                <span class="text-xl">➕</span> Nuevo Registro
            </a>
            <hr>
            <button id="btnCerrarSesionLateral" class="text-left text-red-500 hover:text-red-700 font-semibold flex items-center gap-2">
                <span class="text-xl">🚪</span> Salir
            </button>
        </div>
    </div>

    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40 transition-opacity"></div>

    <!-- Encabezado Azul -->
    <div class="bg-crono-blue text-white p-4 md:px-8 md:py-5 shadow-md flex justify-between items-center z-10 w-full">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 flex items-center justify-center overflow-hidden shadow-sm">
                <img src="/Images/logoCronoCare.png" alt="Logo CronoCare" class="w-full h-full object-cover">
            </div>
            <h1 class="text-2xl md:text-3xl font-bold tracking-wide">CronoCare</h1>
        </div>
        <button id="openSidebar" class="hidden md:block text-white hover:text-crono-light transition-colors">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </div>

    <!-- Contenedor del Formulario -->
    <div class="flex-1 pb-24 md:pb-12 w-full max-w-xl mx-auto flex flex-col p-6 mt-4">

        <div class="flex items-center mb-6 w-full">
            <a id="btnVolverDetalle" href="detalle_farmaco.html" class="text-gray-700 hover:text-crono-teal transition-colors flex-shrink-0">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>
                </svg>
            </a>
            <h2 class="text-xl md:text-2xl font-bold text-center text-crono-dark tracking-wide flex-1 mr-10 uppercase">EDITAR FÁRMACO</h2>
        </div>

        <form id="formEditarMedicamento" class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-gray-200 flex flex-col gap-5">

            <!-- Nombre del Medicamento -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1 pl-1">Nombre del medicamento:</label>
                <input type="text" id="txtNombreMedicamento" class="w-full bg-gray-100 border-2 border-transparent rounded-full px-4 py-2.5 focus:outline-none focus:border-crono-teal shadow-inner" required>
            </div>

            <!-- Vía de Administración -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1 pl-1">Vía de administración:</label>
                <select id="selectVia" class="w-full bg-gray-100 border-2 border-transparent rounded-full px-4 py-2.5 focus:outline-none focus:border-crono-teal shadow-inner appearance-none text-gray-700" required>
                    <option value="" disabled selected>Cargando vías...</option>
                </select>
            </div>

            <div class="flex gap-4">
                <div class="flex-1">
                    <label class="block text-sm font-bold text-gray-700 mb-1 pl-1">Intervalo (horas):</label>
                    <input type="number" id="txtIntervalo" min="1" max="168" class="w-full bg-gray-100 border-2 border-transparent rounded-full px-4 py-2.5 text-center font-semibold focus:outline-none focus:border-crono-teal shadow-inner" required>
                </div>
                <div class="flex-1">
                    <label class="block text-sm font-bold text-gray-700 mb-1 pl-1">Duración (días):</label>
                    <input type="number" id="txtDuracion" min="1" max="365" class="w-full bg-gray-100 border-2 border-transparent rounded-full px-4 py-2.5 text-center font-semibold focus:outline-none focus:border-crono-teal shadow-inner" required>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1 pl-1 text-center">Hora de la primera toma:</label>
                <div class="flex justify-center">
                    <input type="time" id="txtHoraInicio" class="bg-gray-200 border-2 border-transparent rounded-full px-6 py-2 text-center font-bold text-lg focus:outline-none focus:border-crono-teal shadow-inner" required>
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="flex flex-col gap-3 mt-4">
                <a id="btnActualizarFoto" href="#" class="w-full bg-crono-teal text-white font-bold py-3 rounded-full hover:bg-crono-blue transition-colors shadow-md text-sm tracking-wide block text-center">
                    ACTUALIZAR FOTO
                </a>
                <button type="submit" id="btnGuardarCambios" class="w-full bg-crono-blue text-white font-bold py-3 rounded-full hover:bg-blue-700 transition-colors shadow-md text-sm tracking-wide">
                    GUARDAR CAMBIOS
                </button>
            </div>

        </form>
    </div>

    <!-- Script Lógico Integrado -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const openBtn = document.getElementById('openSidebar');
        const closeBtn = document.getElementById('closeSidebar');

        function toggleMenu() {
            if (sidebar && overlay) {
                sidebar.classList.toggle('translate-x-full');
                overlay.classList.toggle('hidden');
            }
        }
        if (openBtn) openBtn.addEventListener('click', toggleMenu);
        if (closeBtn) closeBtn.addEventListener('click', toggleMenu);
        if (overlay) overlay.addEventListener('click', toggleMenu);

        function cerrarSesion() {
            localStorage.removeItem("usuarioLogueado");
            sessionStorage.removeItem("empleados_usuario");
            window.location.replace("login.html");
        }
        document.getElementById('btnCerrarSesionLateral')?.addEventListener('click', cerrarSesion);

        function obtenerUsuarioSesion() {
            const guardado = localStorage.getItem("usuarioLogueado") || sessionStorage.getItem("empleados_usuario");
            if (!guardado) return null;
            try {
                const u = JSON.parse(guardado);
                const id = u.id ?? u.idUsuario;
                return id ? { id: Number(id), nombre: u.nombre } : null;
            } catch (e) {
                return null;
            }
        }

        const params = new URLSearchParams(window.location.search);
        const idMedicamento = params.get("id");

        document.addEventListener("DOMContentLoaded", async () => {
            const usuario = obtenerUsuarioSesion();
            if (!usuario) {
                window.location.replace("login.html");
                return;
            }

            if (!idMedicamento) {
                alert("No se especificó un medicamento para editar.");
                window.location.replace("index.html");
                return;
            }

            // Actualizar enlaces dinámicos con el ID actual
            document.getElementById("btnVolverDetalle").href = `detalle_farmaco.html?id=${idMedicamento}`;
            document.getElementById("btnActualizarFoto").href = `tomar_fotografia.html?id=${idMedicamento}`;

            // ORDEN IMPORTANTE: Primero esperamos a que carguen las vías y LUEGO cargamos los datos del fármaco
            await cargarViasAdministracion();
            await cargarDatosMedicamento(usuario.id, idMedicamento);
        });

        async function cargarViasAdministracion() {
            try {
                const response = await fetch('/api/Auth/catalogos/vias-administracion');
                if (response.ok) {
                    const vias = await response.json();
                    const selectVia = document.getElementById("selectVia");
                    if (selectVia) {
                        selectVia.innerHTML = '<option value="" disabled selected>Seleccionar vía</option>';
                        vias.forEach(v => {
                            const idV = v.id ?? v.idVia;
                            selectVia.innerHTML += `<option value="${idV}">${v.nombre}</option>`;
                        });
                    }
                }
            } catch (e) {
                console.error("Error al cargar vías:", e);
            }
        }

        async function cargarDatosMedicamento(idUsuario, idMed) {
            try {
                const response = await fetch(`/api/Auth/medicamentos/detalle/${idUsuario}/${idMed}`);
                if (!response.ok) throw new Error("No se pudo obtener la información del fármaco.");

                const data = await response.json();
                console.log("Datos recibidos para editar:", data);

                // 1. Nombre
                document.getElementById("txtNombreMedicamento").value = data.nombreMedicamento || "";

                // 2. Vía de administración
                const selectVia = document.getElementById("selectVia");
                if (selectVia && data.idVia) {
                    selectVia.value = String(data.idVia);
                }

                // 3. Intervalo y Duración
                document.getElementById("txtIntervalo").value = data.intervaloHoras || 8;
                document.getElementById("txtDuracion").value = data.duracionDias || 5;

                // 4. Hora de la primera toma
                if (data.horaPrimeraToma) {
                    let horaLimpia = data.horaPrimeraToma.toString();
                    if (horaLimpia.includes('T')) {
                        horaLimpia = horaLimpia.split('T')[1];
                    }
                    document.getElementById("txtHoraInicio").value = horaLimpia.substring(0, 5);
                }

            } catch (error) {
                console.error("Error al precargar datos:", error);
                alert("Error al cargar los datos del fármaco para edición.");
            }
        }

        // 5. EVENTO SUBMIT (GUARDAR CAMBIOS SIN PERDER EL ID EN LA URL)
        document.getElementById("formEditarMedicamento").addEventListener("submit", async (e) => {
            e.preventDefault(); // Evita la recarga por defecto que limpia la URL
            const usuario = obtenerUsuarioSesion();

            const modeloEdicion = {
                idUsuario: usuario.id,
                idMedicamento: Number(idMedicamento),
                idVia: Number(document.getElementById("selectVia").value),
                nombreMedicamento: document.getElementById("txtNombreMedicamento").value,
                foto: null,
                intervaloHoras: Number(document.getElementById("txtIntervalo").value),
                duracionDias: Number(document.getElementById("txtDuracion").value),
                horaPrimeraToma: document.getElementById("txtHoraInicio").value + ":00" // Formato TIME (HH:mm:ss)
            };

            try {
                const response = await fetch('/api/Auth/medicamento/editar', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(modeloEdicion)
                });

                const resultado = await response.json();

                if (!response.ok) {
                    throw new Error(resultado.message || "Error al actualizar el medicamento.");
                }

                alert("¡Fármaco actualizado con éxito!");

                // Redirección automática manteniendo el ID para regresar a la vista de detalle
                window.location.replace(`detalle_farmaco.html?id=${idMedicamento}`);

            } catch (error) {
                console.error("Error:", error);
                alert("No se pudo guardar: " + error.message);
            }
        });
    </script>
</body>
</html>
