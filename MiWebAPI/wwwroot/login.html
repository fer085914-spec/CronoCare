<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronoCare - Iniciar Sesión</title>
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'crono-blue': '#27749C',
                        'crono-light': '#E1F4F6',
                        'crono-teal': '#287F89',
                        'crono-dark': '#222222'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-crono-light font-sans flex flex-col justify-center overflow-x-hidden">

    <!-- Contenedor Principal: Fila dividida en PC con buen espacio -->
    <div class="w-full max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 items-center px-6 md:px-16 py-12 gap-12 md:gap-20">

        <!-- Mitad Izquierda: Logo Grande (Mismas dimensiones proporcionales al registro) -->
        <div class="hidden md:flex flex-col items-center justify-center p-4 text-center">
            <div class="w-52 h-52 lg:w-72 lg:h-72 flex items-center justify-center overflow-hidden drop-shadow-xl mb-6">
                <img src="/Images/logoCronoCare.png" alt="Logo CronoCare" class="w-full h-full object-contain">
            </div>
            <h1 class="text-4xl lg:text-5xl font-bold text-crono-blue tracking-wide mb-3">CronoCare</h1>
            <!--<p class="text-gray-600 text-base lg:text-lg max-w-sm">Tu asistente inteligente para el control y seguimiento de medicamentos.</p>-->
        </div>

        <!-- Mitad Derecha: Formulario Compacto -->
        <div class="flex flex-col items-start justify-center w-full max-w-sm mx-auto md:mx-0">

            <div class="flex flex-col items-start mb-6 text-left w-full">
                <h2 class="text-2xl md:text-3xl font-bold text-crono-dark mb-1">¡Bienvenido de nuevo!</h2>
                <p class="text-gray-600 text-sm">Ingresa a tu cuenta para continuar</p>
            </div>

            <form id="loginForm" class="w-full flex flex-col gap-4">
                <div class="w-full text-left">
                    <label class="block text-sm text-gray-600 mb-1 pl-2 font-semibold">Correo electrónico:</label>
                    <input type="email" id="email" value="fer085914@gmail.com" class="w-full border-2 border-transparent bg-white rounded-full px-4 py-3 focus:outline-none focus:border-crono-teal shadow-sm transition-colors" required>
                </div>

                <div class="w-full text-left">
                    <label class="block text-sm text-gray-600 mb-1 pl-2 font-semibold">Contraseña:</label>
                    <input type="password" id="password" value="12345" class="w-full border-2 border-transparent bg-white rounded-full px-4 py-3 focus:outline-none focus:border-crono-teal shadow-sm transition-colors" required>
                </div>

                <!-- Contenedor de Errores de API -->
                <div id="mensajeLogin" class="hidden text-red-500 font-semibold text-sm text-center mt-2"></div>

                <button type="submit" id="btnLogin" class="mt-2 bg-crono-teal text-white font-bold py-3.5 rounded-full hover:bg-crono-blue transition-colors shadow-lg w-full text-lg">
                    INICIAR SESIÓN
                </button>
            </form>

            <!-- Enlace a Registro -->
            <div class="mt-6 text-center md:text-left text-sm w-full">
                <p class="text-gray-600 inline">¿Aún no tienes cuenta? </p>
                <a href="registro.html" class="text-crono-teal font-bold hover:underline inline-block">
                    Regístrate aquí
                </a>
            </div>
        </div>

    </div>

    <!-- Script de conexión a la API -->
    <script src="js/login.js"></script>
</body>
</html>
