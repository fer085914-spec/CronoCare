<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CronoCare - Registro</title>
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'crono-blue': '#27749C',
                        'crono-light': '#E1F4F6',
                        'crono-teal': '#287F89',
                        'crono-dark': '#222222'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-crono-light font-sans flex flex-col justify-center overflow-x-hidden">

    <!-- Contenedor Principal -->
    <div class="w-full max-w-[95rem] mx-auto grid grid-cols-1 md:grid-cols-12 items-center px-4 md:px-8 py-12 gap-12 lg:gap-16">

        <!-- Lado Izquierdo: Logo más grande y pegado más a la izquierda -->
        <div class="hidden md:flex md:col-span-7 flex-col items-center justify-center p-4 text-center pl-6 lg:pl-20">
            <div class="w-64 h-64 lg:w-96 lg:h-96 flex items-center justify-center overflow-hidden drop-shadow-2xl mb-6">
                <img src="/Images/logoCronoCare.png" alt="Logo CronoCare" class="w-full h-full object-contain">
            </div>
            <h1 class="text-5xl lg:text-6xl font-bold text-crono-blue tracking-wide mb-4">CronoCare</h1>
            <p class="text-gray-600 text-lg lg:text-xl max-w-md">Tu asistente inteligente para el control y seguimiento de medicamentos.</p>
        </div>

        <!-- Lado Derecho: Formulario de Registro -->
        <div class="flex md:col-span-5 flex-col items-start justify-center w-full max-w-md mx-auto md:pr-8">

            <div class="flex flex-col items-start mb-8 text-left">
                <h2 class="text-2xl md:text-3xl font-bold text-crono-dark mb-2">Crea tu perfil en segundos</h2>
                <p class="text-gray-600">Completa los datos para comenzar</p>
            </div>

            <form id="registerForm" class="w-full flex flex-col gap-4">

                <div class="w-full">
                    <label class="block text-sm text-gray-600 mb-1 pl-2 font-semibold">Nombre o apodo:</label>
                    <input type="text" id="nombre" class="w-full border-2 border-transparent bg-white rounded-full px-4 py-3 focus:outline-none focus:border-crono-teal shadow-sm transition-colors" required>
                </div>

                <div class="w-full">
                    <label class="block text-sm text-gray-600 mb-1 pl-2 font-semibold">Correo electrónico:</label>
                    <input type="email" id="email" class="w-full border-2 border-transparent bg-white rounded-full px-4 py-3 focus:outline-none focus:border-crono-teal shadow-sm transition-colors" required>
                </div>

                <div class="w-full">
                    <label class="block text-sm text-gray-600 mb-1 pl-2 font-semibold">Contraseña:</label>
                    <input type="password" id="password" class="w-full border-2 border-transparent bg-white rounded-full px-4 py-3 focus:outline-none focus:border-crono-teal shadow-sm transition-colors" required>
                </div>

                <div class="mt-2 w-full">
                    <label class="block text-sm text-gray-600 mb-2 pl-2 font-semibold">¿Cómo usarías CronoCare?</label>
                    <div class="flex flex-col gap-3 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input type="radio" name="uso" value="personal" checked class="w-5 h-5 text-crono-teal focus:ring-crono-teal">
                            <span class="text-gray-700 group-hover:text-crono-teal transition-colors">Solo para mí (Personal)</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input type="radio" name="uso" value="cuidador" class="w-5 h-5 text-crono-teal focus:ring-crono-teal">
                            <span class="text-gray-700 group-hover:text-crono-teal transition-colors">Para cuidar a alguien más</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input type="radio" name="uso" value="ambos" class="w-5 h-5 text-crono-teal focus:ring-crono-teal">
                            <span class="text-gray-700 group-hover:text-crono-teal transition-colors">Ambas</span>
                        </label>
                    </div>
                </div>

                <!-- Contenedor para mostrar errores de la API -->
                <div id="mensajeRegistro" class="hidden text-red-500 font-semibold text-sm text-center mt-2"></div>

                <button type="submit" id="btnRegister" class="mt-4 bg-crono-teal text-white font-bold py-3.5 rounded-full hover:bg-crono-blue transition-colors shadow-lg w-full text-lg">
                    CREAR CUENTA
                </button>
            </form>

            <div class="mt-8 text-center md:text-left text-sm w-full">
                <a href="login.html" class="text-gray-500 hover:text-crono-teal hover:underline transition-colors font-medium">
                    ← Volver al inicio de sesión
                </a>
            </div>

        </div>

    </div>

    <!-- Script de lógica de registro -->
    <script src="js/registro.js"></script>
</body>
</html>
